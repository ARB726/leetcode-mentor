name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest cfn-lint==1.43.2
      - run: python -m pytest -q
      - run: cfn-lint deploy/ecs.yaml
      - run: docker build -t mentor:test .
