name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: bash -n ../deploy/release-web.sh
      - run: docker build -t mentor-web:test .
      - name: Smoke test production container
        run: |
          docker run -d --name mentor-web -p 8501:8501 mentor-web:test
          trap 'docker logs mentor-web; docker rm -f mentor-web' EXIT
          curl --fail --max-time 5 --retry 15 --retry-all-errors --retry-delay 2 --retry-max-time 60 http://localhost:8501/_stcore/health
          curl --fail --output /tmp/mentor-home.html http://localhost:8501/
          grep -q 'Practice studio' /tmp/mentor-home.html
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r deploy/requirements.txt pytest cfn-lint==1.43.2
      - run: python -m pytest -q
      - run: cfn-lint deploy/*.yaml
      - run: docker build -t mentor:test .
