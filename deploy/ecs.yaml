AWSTemplateFormatVersion: '2010-09-09'
Description: LeetCode Mentor portfolio deployment. One session-based Streamlit task behind HTTPS; existing public subnets, certificate and secret required.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different availability zones with an internet gateway route
  ImageUri:
    Type: String
    Description: Immutable ECR image URI tagged with a Git commit SHA
    AllowedPattern: '.+\.dkr\.ecr\..+\.amazonaws\.com/.+:.+'
  CertificateArn:
    Type: String
    AllowedPattern: 'arn:aws:acm:.*'
    Description: Issued ACM certificate for your domain in this region
  GroqSecretArn:
    Type: String
    AllowedPattern: 'arn:aws:secretsmanager:.*'
    Description: Same-region Secrets Manager secret containing the raw Groq API key, encrypted with the default AWS-managed key
Resources:
  Cluster:
    Type: AWS::ECS::Cluster
  Logs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 14
  ExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: ECS injects the provider secret; the application needs no AWS permissions
        must: Scope secret reads to the supplied ARN
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: ReadProviderKey
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GroqSecretArn
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS and HTTP redirect
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Task public IP supports outbound Groq and ECR traffic without a NAT gateway
        must: Permit inbound app traffic only from the load balancer
    Properties:
      GroupDescription: Streamlit traffic from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref PublicSubnets
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '300'}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Streamlit uses WebSockets and session-local downloads
        must: Keep IP targets and session stickiness
    Properties:
      VpcId: !Ref VpcId
      Port: 8501
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /_stcore/health
      TargetGroupAttributes:
        - {Key: stickiness.enabled, Value: 'true'}
        - {Key: stickiness.type, Value: lb_cookie}
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: mentor
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ContainerPort: 8501}]
          Secrets: [{Name: GROQ_API_KEY, ValueFrom: !Ref GroqSecretArn}]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mentor
  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Metadata:
      com.aws.cloudformation.Context:
        why: A single task keeps this portfolio deployment small; sessions are ephemeral
        must: Keep one task until durable user storage is implemented
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Task
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnets
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: mentor
          ContainerPort: 8501
          TargetGroupArn: !Ref TargetGroup
Outputs:
  LoadBalancerDns:
    Description: Point your certificate domain at this hostname using a Route 53 alias or DNS CNAME
    Value: !GetAtt LoadBalancer.DNSName
